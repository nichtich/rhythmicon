name: Test JavaScript
on:
  push:
    paths:
      - 'package/rhythmicon-rhythm/**'
      - 'package/rhythmicon-vue/**'
      - 'package/rhythmicon-app/**'
      - '!package/rhythmicon-app/rhythms.json'
      - '!*.md'
  pull_request:
    paths:
      - 'package/rhythmicon-rhythm/**'
      - 'package/rhythmicon-vue/**'
      - 'package/rhythmicon-app/**'
      - '!package/rhythmicon-app/rhythms.json'
      - '!*.md'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 26.x ]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: |
        npm ci
        npm ci --workspaces
        npm run test
        npm run build
